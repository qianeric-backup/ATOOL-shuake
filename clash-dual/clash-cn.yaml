# ============================================================
# 双 clash 进程之一：国内直连实例（学习通 / 国内题库）
# 端口: 7890（混合端口 HTTP+SOCKS5）
# 本实例不做任何代理——学习通、搜题 API 全部 DIRECT，
# 保证国内站点访问快、稳、不绕路。
# ============================================================
mixed-port: 7890
allow-lan: true
mode: rule
log-level: info

proxies: []

proxy-groups: []

rules:
  - MATCH,DIRECT
