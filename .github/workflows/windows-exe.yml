name: 知到 Windows exe 打包（zhidaoshuake）

on:
  workflow_dispatch: {}
  push:
    tags:
      - "zhidaoshuake-v*"
      - "知到v*"
permissions:
  contents: write

jobs:
  build-windows-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build deps
        run: |
          pip install -q "pyinstaller>=6.5" "PySide6==6.9.*" requests "playwright>=1.40" "numpy==1.26.4" "opencv-python==4.10.0.82" "pygetwindow==0.0.9" "Pillow>=10,<13"
          python -c "import PIL, pygetwindow, requests, playwright, PySide6; print('deps ok')"

      - name: Build zhidaoshuake.exe (onefile)
        shell: bash
        working-directory: 知到刷课/autovisor-src/Autovisor-main/wine-build
        run: |
          set -uo pipefail
          appRoot="$(cd .. && pwd)"
          src="$(pwd)/src"
          rm -rf "$src"
          mkdir -p "$src"
          # 复制源码（排除构建产物与运行时用户数据）
          shopt -s dotglob nullglob
          for f in "$appRoot"/*; do
            name="$(basename "$f")"
            case "$name" in
              wine-build|deb-build|.playwright_browsers|.pw-browsers|.runtime_libs|logs|__pycache__|.pytest_cache|.github|zhidaoshuake.exe|config.ini|configs.ini|data) continue ;;
            esac
            case "$name" in *.zip|*.exe|*.deb|*.pyc) continue ;; esac
            cp -r "$f" "$src/"
          done
          mkdir -p "$src/data"
          cp "$appRoot/data/mirrors.json" "$src/data/" 2>/dev/null || true
          cp "zhidaoshuake.spec" "$src/zhidaoshuake.spec"
          cd "$src"
          echo "::group::PyInstaller 构建"
          python -m PyInstaller "zhidaoshuake.spec" --noconfirm --clean 2>&1 | tee pyi-build.log
          code="${PIPESTATUS[0]}"
          echo "::endgroup::"
          if [ "$code" -ne 0 ]; then
            echo "PyInstaller 退出码: $code"
            tail -n 40 pyi-build.log | sed 's/^/  /'
            msg="$(tail -n 20 pyi-build.log | tr '\n' '~' | cut -c1-4000)"
            echo "::error title=PyInstaller 构建失败 (exit $code)::$msg"
            exit 1
          fi
          ls -l dist/
          cp dist/zhidaoshuake.exe "$appRoot/zhidaoshuake.exe"
          ls -l "$appRoot/zhidaoshuake.exe"

      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pyi-build-log
          path: 知到刷课/autovisor-src/Autovisor-main/wine-build/src/pyi-build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 知到刷课助手.exe
          path: 知到刷课/autovisor-src/Autovisor-main/zhidaoshuake.exe
          retention-days: 14

      - name: Release (tag push only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: 知到刷课/autovisor-src/Autovisor-main/zhidaoshuake.exe
          generate_release_notes: true
