name: 知到 Windows exe 打包（zhidaoshuake）

on:
  workflow_dispatch: {}
  push:
    tags:
      - "zhidaoshuake-v*"
      - "知到v*"
permissions:
  contents: write

jobs:
  build-windows-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build deps
        run: |
          pip install -q "pyinstaller>=6.5" "PySide6==6.9.*" requests "playwright>=1.40" "numpy==1.26.4" "opencv-python==4.10.0.82" "pygetwindow==0.0.9" "Pillow>=10,<13"
          python -c "import PIL, pygetwindow, requests, playwright, PySide6; print('deps ok')"

      - name: Build zhidaoshuake.exe (onefile)
        shell: pwsh
        working-directory: 知到刷课/autovisor-src/Autovisor-main/wine-build
        run: |
          $ErrorActionPreference = "Stop"
          $appRoot = Resolve-Path ..
          $src = Join-Path (Get-Location) "src"
          New-Item -ItemType Directory -Force -Path $src | Out-Null
          Get-ChildItem $appRoot -Force | Where-Object {
              $_.Name -notin @(
                  'wine-build','deb-build','.playwright_browsers','.pw-browsers',
                  '.runtime_libs','logs','__pycache__','.pytest_cache','.github',
                  'zhidaoshuake.exe','config.ini','configs.ini','data',
              ) -and $_.Name -notmatch '\.(zip|exe|deb|pyc)$'
          } | ForEach-Object {
              Copy-Item $_.FullName -Destination $src -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path (Join-Path $src 'data') | Out-Null
          Copy-Item (Join-Path $appRoot 'data/mirrors.json') (Join-Path $src 'data') -Force -ErrorAction SilentlyContinue
          Copy-Item -ErrorAction SilentlyContinue `
            (Join-Path (Get-Location) 'zhidaoshuake.spec') `
            (Join-Path $src 'zhidaoshuake.spec')
          Set-Location $src
          # native 命令的 stderr 不应被 ErrorActionPreference=Stop 当成终止错误
          $PSNativeCommandUseErrorActionPreference = $false
          $ErrorActionPreference = "Continue"
          & python -m PyInstaller "zhidaoshuake.spec" --noconfirm --clean 2>&1 |
            Tee-Object -FilePath pyi-build.log | Out-Host
          $code = $LASTEXITCODE
          if ($code -ne 0) {
              $tail = (Get-Content pyi-build.log -Tail 80 -ErrorAction SilentlyContinue) -join "`n"
              Write-Host "----- PyInstaller 构建失败, 日志尾部 -----"
              Write-Host $tail
              # 写入 step summary: 公开仓库里可直接查看失败原因
              "## PyInstaller 构建失败 (exit $code)`n`n``````text`n$tail`n``````" |
                Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
              exit 1
          }
          Copy-Item 'dist/zhidaoshuake.exe' "$appRoot/zhidaoshuake.exe" -Force
          Get-Item $appRoot/zhidaoshuake.exe | Select-Object Name, Length

      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pyi-build-log
          path: 知到刷课/autovisor-src/Autovisor-main/wine-build/src/pyi-build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 知到刷课助手.exe
          path: 知到刷课/autovisor-src/Autovisor-main/zhidaoshuake.exe
          retention-days: 14

      - name: Release (tag push only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: 知到刷课/autovisor-src/Autovisor-main/zhidaoshuake.exe
          generate_release_notes: true
